name: Release

# Tagging is the whole trigger: `git tag v1.2.3 && git push origin v1.2.3`
# builds, hashes and creates a draft release. Doing it by hand is where mistakes creep in —
# a stale exe, a forgotten SHA256, or a rate-limited CLI leaving a half-made
# release behind.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:        # lets a release be re-run from the Actions tab

permissions:
  contents: write           # required to create the release

jobs:
  release:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Verify the tag matches the project version
        shell: pwsh
        run: |
          # A tag that disagrees with <Version> would ship a build whose
          # self-reported version is wrong, and the updater compares versions —
          # so it could offer an update that never appears to apply.
          $tag = "${{ github.ref_name }}" -replace '^v', ''
          $proj = ([xml](Get-Content YuCap.csproj)).Project.PropertyGroup.Version
          Write-Host "tag=$tag  csproj=$proj"
          if ($tag -ne $proj) {
            Write-Error "Tag $tag does not match <Version>$proj</Version> in YuCap.csproj"
            exit 1
          }

      - name: Build
        run: dotnet build YuCap.csproj -c Release --warnaserror

      - name: Publish single-file exe
        run: >
          dotnet publish YuCap.csproj -c Release -r win-x64
          --self-contained false -p:PublishSingleFile=true
          -o publish

      - name: Compute SHA256
        id: hash
        shell: pwsh
        run: |
          $h = (Get-FileHash publish/YuCap.exe -Algorithm SHA256).Hash.ToLower()
          $sizeMb = [math]::Round((Get-Item publish/YuCap.exe).Length / 1MB, 1)
          Write-Host "SHA256: $h  size: $sizeMb MB"
          "sha256=$h" >> $env:GITHUB_OUTPUT
          "size=$sizeMb" >> $env:GITHUB_OUTPUT

      # 下書きのまま作る。「(ここに書く)」を変更点に書き換えてから公開する。
      # 本文は「## 変更点」「## ダウンロード」と README への案内1行だけにし、
      # インストール・更新・SmartScreen の説明は README に置く。
      # 注意: 自動更新（Updater.cs）は添付の digest を優先し、無いときだけ本文で最初に
      # 現れる64桁の16進を exe の SHA256 として使う。表は exe の1行だけにし、
      # これより前に別の64桁の16進を書かないこと。
      - name: Create the release
        uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }}
          draft: true
          files: publish/YuCap.exe
          body: |
            ## 変更点

            (ここに書く)

            ## ダウンロード

            | ファイル | サイズ | SHA256 |
            | --- | --- | --- |
            | YuCap.exe | ${{ steps.hash.outputs.size }} MB | `${{ steps.hash.outputs.sha256 }}` |

            インストールと更新の方法は [README](https://github.com/Yu5rin/YuCap#インストール) をご覧ください。
